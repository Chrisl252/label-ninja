<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label Ninja — Warehouse Bin & Thermal Barcode Studio</title>
  <meta name="description" content="Free thermal label generator for warehouse rack bin labels, Amazon FNSKUs, and reseller inventory. Compatible with Dymo, Rollo, Zebra printers.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JsBarcode library -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- PDFMake -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <style>
    .canvas-element { user-select: none; touch-action: none; }
    .canvas-element.selected { outline: 2px dashed #6366f1; outline-offset: 2px; }
    @media print {
      body * { visibility: hidden; }
      #label-canvas-container, #label-canvas-container *, #batch-print-area, #batch-print-area * { visibility: visible; }
      .no-print { display: none !important; }
      body { background: white !important; margin: 0 !important; padding: 0 !important; }
      .print-label, #label-canvas {
        position: relative !important;
        left: 0 !important; top: 0 !important;
        margin: 0 auto 10px auto !important;
        box-shadow: none !important;
        border: none !important;
        break-after: page; page-break-after: always;
      }
      .canvas-element.selected { outline: none !important; }
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col relative select-none">

  <!-- Top Navbar -->
  <header class="border-b border-gray-800 bg-gray-950 px-6 py-3 flex justify-between items-center no-print flex-wrap gap-3">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white font-bold px-3 py-1 rounded-lg text-lg tracking-wider flex items-center space-x-2">
        <span>🥷</span>
        <span>LABEL NINJA</span>
      </div>
      <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded font-mono font-semibold">BIN & THERMAL STUDIO</span>
    </div>

    <!-- Center Label Size Selector -->
    <div class="flex items-center space-x-3">
      <label class="text-xs text-gray-400 font-semibold uppercase">Label Size:</label>
      <select id="preset-size" onchange="changeCanvasSize()" class="bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 font-mono">
        <optgroup label="Bin & Rack Labels">
          <option value="standard" selected>2.25" x 1.25" (Dymo 30336 Bin Label)</option>
          <option value="fnsku">2" x 1" (Dymo 30334 Small Bin / FNSKU)</option>
          <option value="address">1.125" x 3.5" (Dymo 30252 Long Rack Label)</option>
        </optgroup>
        <optgroup label="Rollo & Zebra Shipping/Box">
          <option value="shipping">4" x 6" (Rollo / Zebra Carton)</option>
          <option value="box_3">4" x 3" (Box Inventory)</option>
          <option value="polybag">2" x 2" (Square Bin / Polybag)</option>
        </optgroup>
      </select>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center space-x-3">
      <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-lg shadow transition flex items-center space-x-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
        <span>Print Labels</span>
      </button>
      <button onclick="exportVectorPDF()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-lg shadow transition flex items-center space-x-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span>Download PDF</span>
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Left Sidebar -->
    <aside class="w-72 bg-gray-950 border-r border-gray-800 p-4 flex flex-col space-y-5 no-print overflow-y-auto">
      
      <!-- Quick Bin Generator Tool -->
      <div class="bg-indigo-950/40 border border-indigo-800/60 rounded-xl p-3.5 space-y-3">
        <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider flex items-center space-x-1.5">
          <span>📦</span>
          <span>Batch Rack BIN Generator</span>
        </h3>
        <p class="text-[11px] text-gray-300 leading-snug">Generate a whole rack of sequential bin labels (e.g. BIN 1A to 20A) in 1 click.</p>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-gray-400 font-semibold uppercase">Shelf Letter</label>
            <input type="text" id="bin-shelf" value="A" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white uppercase font-mono">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 font-semibold uppercase">Prefix</label>
            <input type="text" id="bin-prefix" value="BIN " class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-gray-400 font-semibold uppercase">Start #</label>
            <input type="number" id="bin-start" value="1" min="1" max="500" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white font-mono">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 font-semibold uppercase">End #</label>
            <input type="number" id="bin-end" value="20" min="1" max="500" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white font-mono">
          </div>
        </div>

        <button onclick="generateBinBatch()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded text-xs transition shadow">
          ⚡ Generate Batch Bin Labels
        </button>
      </div>

      <!-- Single Element Tools -->
      <div>
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Single Add Tools</h3>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="addElement('text')" class="flex items-center justify-center space-x-1 p-2 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded text-xs font-semibold text-gray-200">
            <span>T</span> <span>Add Text</span>
          </button>
          <button onclick="addElement('barcode')" class="flex items-center justify-center space-x-1 p-2 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded text-xs font-semibold text-gray-200">
            <span>║▌║</span> <span>Add Barcode</span>
          </button>
        </div>
      </div>

      <!-- Quick Templates -->
      <div>
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Preset Templates</h3>
        <div class="space-y-1.5">
          <button onclick="loadTemplate('single_bin')" class="w-full text-left p-2 bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded text-xs text-gray-300 transition flex justify-between">
            <span>📦 Single BIN Label (BIN 1A)</span>
            <span class="text-[10px] text-indigo-400">Bold</span>
          </button>
          <button onclick="loadTemplate('fnsku')" class="w-full text-left p-2 bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded text-xs text-gray-300 transition flex justify-between">
            <span>📦 Amazon FNSKU Label</span>
            <span class="text-[10px] text-indigo-400">2x1</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Center Stage -->
    <main class="flex-1 bg-gray-900/60 p-8 flex flex-col items-center justify-start overflow-auto relative">
      
      <!-- Formatting Toolbar -->
      <div id="formatting-bar" class="bg-gray-950 border border-gray-800 rounded-xl px-4 py-2 mb-6 flex items-center space-x-4 no-print shadow-xl">
        <span class="text-xs text-gray-400 font-semibold">Inspector:</span>
        <div class="h-4 w-px bg-gray-800"></div>

        <div class="flex items-center space-x-2">
          <span class="text-xs text-gray-400">Font Size:</span>
          <input type="range" id="inspector-size" min="10" max="60" value="28" oninput="updateSelectedElement()" class="w-24">
          <span id="size-val" class="text-xs font-mono text-indigo-300">28px</span>
        </div>

        <div class="h-4 w-px bg-gray-800"></div>

        <div class="flex items-center space-x-2 flex-1">
          <input type="text" id="inspector-text" oninput="updateSelectedElement()" placeholder="Edit text or bin location..." class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500 w-48 font-mono">
        </div>

        <button onclick="deleteSelectedElement()" class="text-xs text-red-400 hover:text-red-300 font-bold px-2 py-1 bg-red-950/50 border border-red-900 rounded">
          🗑️ Delete
        </button>
      </div>

      <!-- Printable Canvas -->
      <div id="label-canvas-container" class="flex items-center justify-center p-6 border border-dashed border-gray-800 bg-gray-950 rounded-xl shadow-2xl">
        <div id="label-canvas" class="bg-white text-black rounded shadow-2xl relative overflow-hidden transition-all duration-200" style="width: 360px; height: 200px;">
          <!-- Dynamic Canvas Elements -->
        </div>
      </div>
    </main>
  </div>

  <!-- Hidden Batch Print Container -->
  <div id="batch-print-area" class="w-full flex flex-col items-center"></div>

  <script class="no-print">
    let elements = [];
    let selectedId = null;
    let nextId = 1;

    const PRESETS = {
      standard: { width: 360, height: 200, name: "2.25x1.25 Dymo 30336" },
      fnsku: { width: 320, height: 180, name: "2x1 Dymo 30334" },
      address: { width: 520, height: 160, name: "1.125x3.5 Address" },
      shipping: { width: 400, height: 600, name: "4x6 Box Shipping" },
      box_3: { width: 400, height: 300, name: "4x3 Box Inventory" },
      polybag: { width: 300, height: 300, name: "2x2 Square" }
    };

    function changeCanvasSize() {
      const presetKey = document.getElementById('preset-size').value;
      const canvas = document.getElementById('label-canvas');
      const p = PRESETS[presetKey] || PRESETS.standard;
      canvas.style.width = p.width + 'px';
      canvas.style.height = p.height + 'px';
    }

    function addElement(type, customProps = {}) {
      const id = 'el-' + (nextId++);
      let newEl = {
        id, type, x: 25, y: 20 + elements.length * 45,
        text: type === 'barcode' ? 'BIN-1A' : 'BIN 1A',
        fontSize: type === 'barcode' ? 14 : 32,
        align: 'center', bold: true, ...customProps
      };
      elements.push(newEl);
      selectElement(id);
      renderCanvas();
    }

    function renderCanvas() {
      const canvas = document.getElementById('label-canvas');
      canvas.innerHTML = '';

      elements.forEach(el => {
        const div = document.createElement('div');
        div.className = `canvas-element absolute cursor-move p-1 ${el.id === selectedId ? 'selected' : ''}`;
        div.style.left = el.x + 'px';
        div.style.top = el.y + 'px';
        div.style.textAlign = el.align;
        div.style.fontSize = el.fontSize + 'px';
        div.style.fontWeight = el.bold ? 'bold' : 'normal';

        div.onclick = (e) => { e.stopPropagation(); selectElement(el.id); };
        makeDraggable(div, el);

        if (el.type === 'text') {
          div.innerText = el.text;
        } else if (el.type === 'barcode') {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.id = `barcode-${el.id}`;
          div.appendChild(svg);
          setTimeout(() => {
            try {
              JsBarcode(`#barcode-${el.id}`, el.text, { format: "CODE128", width: 2, height: 50, displayValue: true, fontSize: 13, fontOptions: "bold", margin: 0 });
            } catch(e) {}
          }, 0);
        }

        canvas.appendChild(div);
      });
    }

    function makeDraggable(domEl, elObj) {
      let isDragging = false, startX, startY, initialX, initialY;
      domEl.onmousedown = (e) => {
        isDragging = true; startX = e.clientX; startY = e.clientY;
        initialX = elObj.x; initialY = elObj.y;
        document.onmousemove = (e) => {
          if (!isDragging) return;
          elObj.x = Math.max(0, initialX + (e.clientX - startX));
          elObj.y = Math.max(0, initialY + (e.clientY - startY));
          domEl.style.left = elObj.x + 'px';
          domEl.style.top = elObj.y + 'px';
        };
        document.onmouseup = () => { isDragging = false; document.onmousemove = null; };
      };
    }

    function selectElement(id) {
      selectedId = id;
      const hit = elements.find(e => e.id === id);
      if (hit) {
        document.getElementById('inspector-text').value = hit.text;
        document.getElementById('inspector-size').value = hit.fontSize;
        document.getElementById('size-val').innerText = hit.fontSize + 'px';
      }
      renderCanvas();
    }

    function updateSelectedElement() {
      if (!selectedId) return;
      const hit = elements.find(e => e.id === selectedId);
      if (hit) {
        hit.text = document.getElementById('inspector-text').value;
        hit.fontSize = parseInt(document.getElementById('inspector-size').value);
        document.getElementById('size-val').innerText = hit.fontSize + 'px';
        renderCanvas();
      }
    }

    function deleteSelectedElement() {
      if (!selectedId) return;
      elements = elements.filter(e => e.id !== selectedId);
      selectedId = null;
      renderCanvas();
    }

    function loadTemplate(type) {
      elements = [];
      if (type === 'single_bin') {
        document.getElementById('preset-size').value = 'standard';
        addElement('text', { text: 'BIN 1A', x: 80, y: 15, fontSize: 34 });
        addElement('barcode', { text: 'BIN-1A', x: 60, y: 75 });
      } else if (type === 'fnsku') {
        document.getElementById('preset-size').value = 'fnsku';
        addElement('text', { text: 'Wireless Bluetooth Earbuds', x: 15, y: 10, fontSize: 12 });
        addElement('barcode', { text: 'X001ABC123', x: 35, y: 40 });
        addElement('text', { text: 'New', x: 135, y: 135, fontSize: 11 });
      }
      changeCanvasSize();
    }

    function generateBinBatch() {
      const prefix = document.getElementById('bin-prefix').value || 'BIN ';
      const shelf = document.getElementById('bin-shelf').value || 'A';
      const start = parseInt(document.getElementById('bin-start').value || 1);
      const end = parseInt(document.getElementById('bin-end').value || 20);

      const batchPrintArea = document.getElementById('batch-print-area');
      batchPrintArea.innerHTML = '';

      for (let i = start; i <= end; i++) {
        const binText = `${prefix}${i}${shelf}`;
        const barcodeCode = binText.replace(/\s+/g, '-');

        const labelDiv = document.createElement('div');
        labelDiv.className = 'print-label bg-white text-black p-4 flex flex-col justify-between items-center shadow-lg border border-gray-300';
        labelDiv.style.width = '360px';
        labelDiv.style.height = '200px';

        const svgId = `batch-bin-svg-${i}`;
        labelDiv.innerHTML = `
          <div class="text-3xl font-black tracking-wider text-black mt-1">${binText}</div>
          <div class="my-1 flex justify-center w-full"><svg id="${svgId}" class="w-full"></svg></div>
        `;
        batchPrintArea.appendChild(labelDiv);

        setTimeout(() => {
          try {
            JsBarcode(`#${svgId}`, barcodeCode, { format: "CODE128", width: 2, height: 50, displayValue: true, fontSize: 12, fontOptions: "bold", margin: 0 });
          } catch(e) {}
        }, 10);
      }

      setTimeout(() => { window.print(); }, 400);
    }

    function exportVectorPDF() {
      const docDefinition = {
        pageSize: { width: 162, height: 90 },
        pageMargins: [6, 6, 6, 6],
        content: elements.map(e => ({ text: e.text, fontSize: e.fontSize / 1.5, alignment: 'center', bold: true }))
      };
      pdfMake.createPdf(docDefinition).download("bin_labels.pdf");
    }

    document.getElementById('label-canvas-container').onclick = () => { selectedId = null; renderCanvas(); };

    window.onload = () => {
      changeCanvasSize();
      loadTemplate('single_bin');
    };
  </script>
</body>
</html>
