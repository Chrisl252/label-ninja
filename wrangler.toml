name = "label-ninja"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.js"

routes = [
  { pattern = "label-ninja.com", custom_domain = true },
  { pattern = "www.label-ninja.com", custom_domain = true }
]

[assets]
binding = "ASSETS"
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# The Worker must see every request so it can 301 www/http to https://label-ninja.com
# and retire /pricing; src/static.js serves /account + /reset as the SPA and
# everything else through ASSETS. "404-page" (not SPA) = unknown paths get
# public/404.html with a real 404 status instead of a soft-404 home page.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "label-ninja-db"
database_id = "852d3ccd-83b6-4ab9-9c39-49a1cf77b88b"

[vars]
APP_ORIGIN = "https://label-ninja.com"

[triggers]
crons = ["*/15 * * * *"]
